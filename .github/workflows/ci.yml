name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Four ratchets: the schema must build from empty, the server must boot and pass
# its tests, the web app must build, and the mobile app must bundle. Each one
# exists because the corresponding thing was silently broken here at some point
# and nothing noticed for months.
jobs:
  # Fails the build if `prisma db push` reappears in anything executable.
  #
  # It is not a style rule. Two backends shared one Postgres instance and each
  # ran `db push --accept-data-loss` at boot, so whichever booted last reshaped
  # the database to match its own schema: 423 rows of User.banned destroyed,
  # twelve GovernmentReference columns and the AdminSession table dropped and
  # recreated 507 times in 16 days.
  #
  # This is now the only copy of the guard, and the right place for one. The
  # runtime check that used to sit in backend/scripts/start could only inspect
  # the file it was written in; this scan covers the Dockerfile, package.json
  # scripts, workflows, and every shell script in the repo.
  no-db-push:
    name: no db push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # guard-self on the two lines below: they contain the phrase being
      # searched for, and would otherwise match the scan and fail every run.
      - name: Scan executable files for the forbidden schema command # guard-self
        run: |
          if grep -rnE 'prisma[[:space:]]+db[[:space:]]+push' \
               --include='*.sh' --include='start' --include='Dockerfile' \
               --include='package.json' --include='*.yml' --include='*.yaml' \
               . 2>/dev/null | grep -v 'guard-self' | grep -vE '^[^:]+:[0-9]+:[[:space:]]*#'; then
            echo "::error::Forbidden schema command found in an executable file. Use 'prisma migrate deploy'." # guard-self
            exit 1
          fi
          echo "No db push found in executable files."

  backend:
    name: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleanslate
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
        working-directory: backend
      - name: Generate Prisma client
        # Placeholder URLs: `prisma generate` only reads the schema, but env.ts
        # rejects a missing or non-Postgres connection string at import time.
        run: bunx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
      - run: bunx tsc --noEmit
        working-directory: backend

      # The claim the whole migration rests on: an empty Postgres, one command,
      # a schema equivalent to schema.prisma. Asserting it in a comment is how
      # this project spent months believing something that was not true, so it
      # is asserted here instead, on every push.
      - name: Build the schema from empty and prove zero drift
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cleanslate
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/cleanslate
        run: |
          bunx prisma migrate deploy
          bunx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      # Boots the real server against a real Postgres and drives it over HTTP.
      # Every production failure this project suffered happened at boot rather
      # than inside a handler, so the tests do not shortcut past it.
      - name: Test
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicvoice_test
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE civicvoice_test;'
          # `bun run test`, not `bun test`: the script carries the timeout that
          # the real server's four-second boot needs.
          bun run test

  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      # NOT `tsc --noEmit`. apps/web/tsconfig.json is `files: []` plus project
      # references, so that command compiles nothing and exits 0 no matter what
      # is broken — it passed for months while real type errors accumulated,
      # including unresolved imports. Point it at the project with the sources.
      - run: bun run typecheck
        working-directory: apps/web
      - run: bun run lint
        working-directory: apps/web
      - run: bun run build
        working-directory: apps/web
        env:
          # Any absolute URL satisfies the production guard in lib/config; the
          # build only needs to prove it compiles, not to reach a real API.
          VITE_BACKEND_URL: https://ci.invalid

      # The bundle has to boot, not just build. A chunking mistake compiles
      # green and white-screens in production; only executing it catches that.
      - name: Install Chromium for the browser checks
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web
      - run: bun run render-check
        working-directory: apps/web
      - run: bun run layout-check
        working-directory: apps/web
      - run: bun run brief-button-check
        working-directory: apps/web
      - run: bun run library-search-check
        working-directory: apps/web
      - run: bun run share-check
        working-directory: apps/web

      # A first visit, clicked for real. The only check that can see an overlay
      # sitting on top of a link that is itself perfectly correct.
      # Static, and it runs before the browser checks because it is instant.
      # A redirect to a path with no route renders NotFound — the feature works
      # and looks broken, which is the expensive kind of bug.
      - run: bun run route-target-check
        working-directory: apps/web

      - run: bun run nav-check
        working-directory: apps/web

      # A name is a link, and a profile is a record. Both were plain text.
      - run: bun run profile-check
        working-directory: apps/web

      # Forty-three routes, opened for real, signed out and signed in. This is
      # the only check that visits a page it was not written to know about: it
      # reads the route table, so a page added tomorrow is covered tomorrow.
      - run: bun run every-page-check
        working-directory: apps/web

      # THE SAME ROUTES, ON A PHONE, WITH SOMETHING ON THE PAGE.
      #
      # every-page-check above opens each route in a narrow desktop window and
      # asks only whether it painted. That is not the same question. Chromium
      # applies <meta name="viewport"> only under mobile emulation, and the
      # routes above are built with an id that is in no database, so every
      # detail page renders an empty "couldn't load this" box that fits any
      # screen. A law page 282px too wide for an iPhone passed both of those.
      #
      # This one uses real device descriptors from iPhone SE to 15 Pro Max,
      # serves two law pages from API responses captured verbatim from
      # production, fetches the real fonts because a fallback typeface measures
      # differently, and fails if a page painted nothing — a white screen is
      # 0px too wide on every screen ever made.
      - run: bun run phone-fit-check
        working-directory: apps/web

      # AND AGAIN SIGNED IN, which is the half that was never measured.
      #
      # The bottom navigation shows FIVE tabs to a visitor and EIGHT to a
      # citizen. Eight across a 393px phone leaves 45px a label, and
      # "Government" needs 60 — so it rendered as "Govern…" on every phone from
      # the day it shipped, while this check passed every time because it only
      # ever ran signed out. A screen nobody signed in ever sees is not the
      # screen to be measuring.
      - run: bun run phone-fit-check
        working-directory: apps/web
        env:
          FIT_SIGNED_IN: "1"

      # The bug queue has to be able to leave the bug queue. Clicking the real
      # button in a real browser and reading the real clipboard — a button that
      # renders and does nothing is the failure this catches.
      - run: bun run bug-report-export-check
        working-directory: apps/web

      # One vote panel, in the right place at both widths. Below xl the right
      # rail stacks under the article, which used to leave the Aye and Nay
      # buttons 1,574px below the brief on a phone — past the entire official
      # text of the bill. The lazy fix is to render the panel twice and hide
      # one; two panels is two tallies that can disagree, so the count is
      # asserted as exactly one.
      - run: bun run vote-placement-check
        working-directory: apps/web

      # Reported bugs, in the reporter's own words, turned into questions a
      # browser can answer. Every one was a control that looked right and did
      # the wrong thing — the kind of defect no type check ever catches.
      - run: bun run reported-bugs-check
        working-directory: apps/web

      # ---------------------------------------------------------------------
      # THE CHECKS THAT EXISTED AND NEVER RAN.
      #
      # Thirty browser checks are written and all thirty pass. Fourteen ran on
      # every push; the other sixteen ran only when somebody remembered to type
      # them, which is the same as not existing. Article V, the juries, the
      # integrity audit and the trust score — most of the constitutional
      # promises — could have broken and nothing would have said a word.
      #
      # These six need no server: they drive the built bundle against stubbed
      # responses. The ten that need a real backend and the thousand-citizen
      # population are in the fullstack-checks job below, which has a Postgres.
      # ---------------------------------------------------------------------

      # The Constitution and the Bill of Rights pages say what the code does.
      # A promise the product no longer keeps is worse than one never made.
      - run: bun run founding-documents-check
        working-directory: apps/web

      # The terms are the same on web and phone. They were not, once.
      - run: bun run terms-parity-check
        working-directory: apps/web

      # A code is emailed, entered, and the account becomes verified. Every
      # step of that was missing at one point while the screen said otherwise.
      - run: bun run verify-email-check
        working-directory: apps/web

      # A ZIP finds a district and the ZIP is not kept afterwards.
      - run: bun run zip-district-check
        working-directory: apps/web

      # Every dialog fits inside a phone. One that overflows has its confirm
      # button off-screen, which reads as a broken feature.
      - run: bun run dialog-fits-check
        working-directory: apps/web

      # The bug reporter is reachable from every page. It is how the owner
      # hands work over, so a page it cannot reach is a page nobody can report.
      - run: bun run bug-reporter-reach-check

      # SIGNING UP WORKS, AND ASKS ONCE.
      #
      # This exists because sign-up dead-ended on the live site: the welcome
      # dialog appeared on top of the verification step and took no clicks, so
      # nobody could join. It is written against the geometry — never more than
      # one full-bleed layer — so any future second modal over a modal fails
      # here, whichever component draws it.
      #
      # It also pins the consent gate: the box is in the form, it names both
      # documents, and /privacy actually says what the law requires it to.
      - run: bun run signup-consent-check
        working-directory: apps/web

      # The built site must be able to say which commit it is. Without the
      # stamp, deploy-check cannot tell a deploy that happened from one that
      # did not, and that is precisely how a finished fix sat unshipped.
      - name: The build stamped itself with a commit
        working-directory: apps/web
        run: |
          test -f dist/version.json || { echo "::error::dist/version.json missing — the version stamp did not run"; exit 1; }
          cat dist/version.json
          node -e "const v=require('./dist/version.json'); if(!v.commit||v.commit==='unknown'){console.error('::error::build carries no commit stamp');process.exit(1)}"

  # ==========================================================================
  # THE FULL-STACK CHECKS.
  #
  # Ten checks that cannot run against a stub: they boot the real backend
  # against a real Postgres holding the thousand synthetic citizens, then drive
  # the built site through a browser. They cover the parts of this product that
  # are promises rather than features — impeachment and system reset, the
  # juries, the integrity audit, the trust score, whether an anonymous vote
  # stays anonymous, whether somebody else's record stays behind a click.
  #
  # All ten were written, all ten passed, and none of them ran on a push. They
  # were a manual step, which is a step nobody takes on the day it matters.
  #
  # ONE AT A TIME, deliberately. Running these concurrently starves them: a
  # previous session ran the backend suite, a load test and the browser checks
  # together and watched five of them fail on 30-second timeouts that had
  # nothing to do with the code. A false failure in a constitutional check is
  # worse than a slow job — it is the kind of thing that gets a check deleted.
  #
  # Each check asserts it leaves the population database exactly as it found
  # it, 1,000 citizens and nothing of its own left behind.
  # ==========================================================================
  fullstack-checks:
    name: full-stack browser checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POPULATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicvoice_population
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun install --frozen-lockfile
        working-directory: apps/web

      - name: Generate the Prisma client
        run: bunx prisma generate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicvoice_population
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/civicvoice_population

      # The population database, built the same way production is built: one
      # `migrate deploy` against an empty database. Never `db push`.
      - name: Build the population database
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/civicvoice_population
          DIRECT_URL: postgresql://postgres:postgres@localhost:5432/civicvoice_population
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE civicvoice_population;'
          bunx prisma migrate deploy

      # A thousand synthetic citizens. Several checks assert the count is
      # unchanged when they finish, so this is their baseline as well as their
      # material.
      - name: Seed the thousand citizens
        run: bun run seed-test-population
        working-directory: backend

      # Same build the web job produces. Any absolute URL satisfies the
      # production guard; each check points the page at the backend it spawns.
      - run: bun run build
        working-directory: apps/web
        env:
          VITE_BACKEND_URL: https://ci.invalid

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/web

      # Article V — impeachment and the system-wide reset. The two powers the
      # Constitution gives citizens over the platform itself.
      - run: bun run article-v-check
        working-directory: apps/web

      # Reports are decided by people, drawn at random, and a juror who is
      # withdrawn is replaced.
      - run: bun run jury-check
        working-directory: apps/web

      # An audit counts and never names. Below the five-person floor it prints
      # the withheld notice and drops the numbers with it.
      - run: bun run integrity-audit-check
        working-directory: apps/web

      # A trust score informs a delegation and ranks nobody. Nothing sorts by
      # it, nothing filters by it.
      - run: bun run trust-check
        working-directory: apps/web

      # A vote cast anonymously is anonymous everywhere, including to us.
      - run: bun run vote-anonymity-check
        working-directory: apps/web

      # Somebody else's record is behind a click, and their anonymous positions
      # are on neither screen.
      - run: bun run record-privacy-check
        working-directory: apps/web

      # Reporting a person reaches a queue and a jury, with no dead ends.
      - run: bun run report-flow-check
        working-directory: apps/web

      # A bug report carries what was pointed at and lands in the admin inbox.
      - run: bun run bug-report-check
        working-directory: apps/web

      # A limited administrator can do exactly what their role allows and
      # nothing else. The owner seat is unreachable from the console.
      - run: bun run admin-permissions-check
        working-directory: apps/web

      # Everything routes to /reference/:id, and the page carries every piece
      # the pages it replaced had.
      - run: bun run one-law-page-check
        working-directory: apps/web

      # A law can be found, followed, previewed and read WITHOUT JavaScript.
      # Every failure this guards against compiles and typechecks perfectly —
      # a <button> that navigates, a site-wide <title>, an SPA shell served to
      # a crawler — so the only way to catch them is to look at what is
      # actually handed over with scripting switched off.
      - run: bun run findable-check
        working-directory: apps/web

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
        working-directory: apps/mobile
      - run: bunx tsc --noEmit
        working-directory: apps/mobile
      - run: bun run lint
        working-directory: apps/mobile

      # Bundle, don't just typecheck.
      #
      # TypeScript resolves @civic/core through tsconfig paths and passes
      # happily while Metro fails on the same import, because Metro will not
      # serve files outside its project root unless they are in watchFolders.
      # This repo shipped for months in a state where `expo export` could not
      # complete at all and nothing caught it.
      - name: Bundle for iOS
        run: bunx expo export --platform ios --output-dir /tmp/expo-ci
        working-directory: apps/mobile

  # Is this branch's work actually going to reach users?
  #
  # THE FAILURE THIS EXISTS FOR. A fix was written, reviewed, tested green and
  # pushed — to a branch nothing deploys. The repository was correct and the
  # product was unchanged, and from outside those look identical. It surfaced
  # only because somebody clicked the button by hand; a server-side change
  # nobody clicks would have sat undeployed indefinitely.
  #
  # This does not fail the build. A branch is allowed to exist. It writes a
  # loud, unmissable summary saying the work is NOT live yet and what to do
  # about it, so "green CI" is never mistaken for "shipped".
  deploy-reminder:
    name: is it live
    runs-on: ubuntu-latest
    if: github.ref != 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Say plainly that this is not deployed
        run: |
          BRANCH="${GITHUB_REF#refs/heads/}"
          AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo "?")
          {
            echo "## Green, but not live"
            echo ""
            echo "This is \`$BRANCH\`, which **nothing deploys**. Vercel and Railway build"
            echo "from \`main\`."
            echo ""
            echo "**$AHEAD commit(s)** here are not on \`main\`, which means they are not in"
            echo "the product, no matter how green this run is."
            echo ""
            echo "Merge to \`main\`, then confirm it actually shipped:"
            echo ""
            echo '```'
            echo "bun run deploy-check"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Branch $BRANCH is $AHEAD commit(s) ahead of main and is not deployed."

  # The same question from the other side. `deploy-reminder` tells a branch it
  # is not live; this tells main what is stranded short of it, so a finished fix
  # sitting on a forgotten branch surfaces on its own instead of waiting to be
  # noticed by hand.
  #
  # Reports, never fails. Work in progress is legitimate, and a build that goes
  # red because somebody has an open branch is a build people learn to ignore.
  stranded-work:
    name: anything stranded
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: List branches carrying work main does not have
        run: |
          REPORT=$(bun run branches 2>&1 || true)
          echo "$REPORT"
          {
            echo "## Branches"
            echo ""
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
